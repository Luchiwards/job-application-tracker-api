services:
  api:
    build:
      context: ./apps/api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - ./data/api:/app/data

  web:
    build:
      context: ./apps/web
    depends_on:
      - api
    ports:
      - "3000:80"

  api-tests:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /workspace
    volumes:
      - ./apps/api:/workspace
    entrypoint: ["dotnet"]

  web-tools:
    image: node:20
    working_dir: /workspace
    volumes:
      - ./apps/web:/workspace
    entrypoint: ["npm"]

